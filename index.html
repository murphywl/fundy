  <canvas id="c"></canvas>

  <nav class="nav">

  <main class="hero">

      Startup development,<br><em>done by founders.</em>
    </h1>
    <div class="hero-meta">
      <p class="meta-text">We&#8217;ve launched startups, failed at some, and shipped others.<br>We know what it takes to get off the ground.</p>

      </div>
    </div>

  </main>

  <script>
  (function() {
    var canvas = document.getElementById('c');
    var ctx    = canvas.getContext('2d');
    var w = 0, h = 0, dpr = 1;
    var dots = [];
    var t = 0;

    // smoothed cursor
    var tx = 0, ty = 0, mx = 0, my = 0;
    var hasPointer = false;

    var SPACING  = 36;
    var REPEL_R  = 140;
    var REPEL_F  = 90;
    var SPRING   = 0.07;
    var DAMP     = 0.76;
    var AMB_AMP  = 14;     // px: ambient drift amplitude
    var BASE_A   = 0.32;   // base dot alpha
    var HOT_A    = 0.88;   // near-cursor alpha
    var BASE_R   = 1.5;    // base dot radius
    var HOT_R    = 3.8;    // near-cursor radius

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width  = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildGrid();
    }

    function buildGrid() {
      dots = [];
      var cols = Math.ceil(w / SPACING) + 1;
      var rows = Math.ceil(h / SPACING) + 1;
      var ox0  = ((w - (cols - 1) * SPACING) / 2);
      var oy0  = ((h - (rows - 1) * SPACING) / 2);
      var jitter = SPACING * 0.75;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var ox = ox0 + c * SPACING + (Math.random() - 0.5) * jitter;
          var oy = oy0 + r * SPACING + (Math.random() - 0.5) * jitter;
          dots.push({
            ox: ox, oy: oy,
            x:  ox, y:  oy,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            p1: Math.random() * Math.PI * 2,
            p2: Math.random() * Math.PI * 2,
            sp: 0.44 + Math.random() * 0.42
          });
        }
      }
    }

    // slow organic drift per dot — each dot has its own speed and phase
    function ambOffset(d) {
      var s = d.sp;
      return {
        x: AMB_AMP * Math.sin(d.p1 + t * s)       + AMB_AMP * 0.45 * Math.sin(d.p2 * 1.5 + t * s * 0.65),
        y: AMB_AMP * Math.cos(d.p2 + t * s * 0.8) + AMB_AMP * 0.45 * Math.cos(d.p1 * 1.3 + t * s * 0.55)
      };
    }

    function update() {
      t += 0.01;

      // smooth cursor
      mx += (tx - mx) * 0.10;
      my += (ty - my) * 0.10;

      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        var amb = ambOffset(d);

        // spring toward ambient rest position
        var fx = (d.ox + amb.x - d.x) * SPRING;
        var fy = (d.oy + amb.y - d.y) * SPRING;

        // cursor repulsion
        if (hasPointer || true) {           // always active (auto-roam on mobile)
          var dx  = d.x - mx;
          var dy  = d.y - my;
          var d2  = dx * dx + dy * dy;
          if (d2 < REPEL_R * REPEL_R && d2 > 0.5) {
            var dist     = Math.sqrt(d2);
            var falloff  = 1 - dist / REPEL_R;
            var strength = REPEL_F * falloff * falloff;
            fx += (dx / dist) * strength;
            fy += (dy / dist) * strength;
          }
        }

        d.vx = (d.vx + fx) * DAMP;
        d.vy = (d.vy + fy) * DAMP;
        d.x += d.vx;
        d.y += d.vy;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        var dx   = d.x - mx;
        var dy   = d.y - my;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var prox = Math.max(0, 1 - dist / REPEL_R);

        var alpha  = BASE_A + (HOT_A  - BASE_A)  * prox * prox;
        var radius = BASE_R + (HOT_R  - BASE_R)  * prox * prox;

        var pr2 = prox * prox;
        var cr = Math.round(231 + (255 - 231) * pr2);
        var cg = Math.round(222 + (255 - 222) * pr2);
        var cb = Math.round(209 + (255 - 209) * pr2);
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(d.x, d.y, radius, 0, 6.2832);
        ctx.fill();
      }
    }

    // mobile auto-roam
    var roamT = 0;
    function roam() {
      if (!hasPointer) {
        roamT += 0.007;
        tx = w * 0.5 + Math.cos(roamT * 0.6) * w * 0.3;
        ty = h * 0.5 + Math.sin(roamT * 0.45) * h * 0.25;
      }
    }

    function loop() {
      roam();
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', function(e) {
      tx = e.clientX; ty = e.clientY; hasPointer = true;
    });
    window.addEventListener('mouseleave', function() { hasPointer = false; });
    window.addEventListener('touchmove', function(e) {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY; hasPointer = true;
    }, { passive: true });
    window.addEventListener('touchend', function() { hasPointer = false; });

    resize();
    tx = w / 2; ty = h / 2; mx = tx; my = ty;
    loop();
  })();
  </script>
